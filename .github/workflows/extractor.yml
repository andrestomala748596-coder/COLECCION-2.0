
name: AJPLAY Catalog Extractor

on:
  push:
    branches:
      - "**"
    paths:
      - "urls.txt"
      - "extractor.py"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/extractor.yml"

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ajplay-catalog-extractor
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar entrada
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          archivo = Path("urls.txt")
          if not archivo.exists() or not archivo.read_text(encoding="utf-8").strip():
              raise SystemExit("ERROR: urls.txt no existe o está vacío.")

          datos = json.loads(archivo.read_text(encoding="utf-8"))
          if not isinstance(datos, list):
              raise SystemExit("ERROR: urls.txt debe contener una lista JSON.")

          print(f"Entradas para procesar: {len(datos)}")
          PY

      - name: Ejecutar extracción por plataforma
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/pipeline.py

      - name: Guardar catálogo actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add base peliculas category_list.json

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar catálogo y bases de extracción [skip ci]"
            git push
          fi
